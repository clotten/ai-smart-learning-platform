# ============================================================
# 本地敏感配置示例（复制本文件为 application-local.yml 后填写）
# 注意：application-local.yml 已被 .gitignore 排除，不会上传到 GitHub
# 用法：复制本文件 → 改名 application-local.yml → 填入你的密码和 Key
# ============================================================

spring:
  datasource:
    username: root
    password: 你的MySQL密码

app:
  jwt:
    # JWT 签名密钥（至少32字节，建议用随机字符串）
    secret: 换成你自己的随机密钥
  deepseek:
    # DeepSeek 开放平台的 API Key（https://platform.deepseek.com）
    api-key: sk-你的key

# 本地开发环境：开启接口文档
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
