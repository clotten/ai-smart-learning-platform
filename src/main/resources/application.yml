server:
  port: 8081

spring:
  application:
    name: learning-platform

  # 默认激活 local 环境：本地敏感配置在 application-local.yml（已被 gitignore，不上传）
  profiles:
    active: local

  # ===== 数据库配置（MySQL 8）=====
  # 注意：用户名/密码在 application-local.yml，本文件不含任何敏感信息，可安全上传 GitHub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

  # ===== Redis 配置（Day4 装好 Redis 后生效）=====
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # 统一 JSON 时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  mail:
    host: smtp.qq.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  configuration:
    # 数据库下划线字段 -> Java 驼峰属性
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发期方便看）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除：deleted 字段 0=未删 1=已删
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 自定义配置：JWT =====
app:
  jwt:
    # 签名密钥在 application-local.yml（敏感信息不上传），token 有效期如下
    expire-minutes: 1440
  deepseek:
    base-url: https://api.deepseek.com
    model: deepseek-chat
  rate-limit:
    ai:                   #AI对话流
      max: 5
      window-seconds: 60
    answer:               #答题限流
      max: 30
      windows-seconds: 60
    blacklist:            #黑名单规则
      violation: 3        #窗口内触发限流几次拉黑
      window-seconds: 3600 #违规计数窗口
      ban-days: 1         #拉黑天数
  frontend-url: http://localhost:5173     # 开发环境
# ===== Swagger 接口文档 =====
# 安全策略：默认关闭（生产环境绝不暴露），local 环境在 application-local.yml 里开启
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false
