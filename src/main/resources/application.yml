server:
  port: 8081

spring:
  application:
    name: learning-platform

  # ===== 数据库配置（MySQL 8，FlyEnv 管理）=====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root   # 如果连不上，改成你的 MySQL 密码

  # ===== Redis 配置（Day4 装好 Redis 后生效）=====
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # 统一 JSON 时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  configuration:
    # 数据库下划线字段 -> Java 驼峰属性
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发期方便看）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除：deleted 字段 0=未删 1=已删
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 自定义配置：JWT =====
app:
  jwt:
    # HS256 密钥（至少 32 字节），上线前必须换掉
    secret: ai-learning-platform-jwt-secret-key-2026-change-me-please-0123456789
    # token 有效期（分钟）
    expire-minutes: 1440
