# ============================================
# 公共配置（零敏感信息，可安全上传 GitHub）
# 敏感配置（密码/密钥）在 application-local.yml / .env
# ============================================
server:
  port: 8081

spring:
  application:
    name: learning-platform

  # 默认激活 local 环境（敏感配置在 application-local.yml，已 gitignore）
  profiles:
    active: local

  # ===== 数据库（用户名/密码在 local）=====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # ===== 邮件 SMTP（账号密码在 local）=====
  mail:
    host: smtp.qq.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ===== JSON 时间格式 =====
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 下划线 -> 驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印 SQL
  global-config:
    db-config:
      logic-delete-field: deleted        # 逻辑删除
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 自定义配置 =====
app:
  jwt:
    expire-minutes: 1440                 # 密钥在 local
  deepseek:
    base-url: https://api.deepseek.com
    model: deepseek-chat
  rate-limit:
    ai:                                  # AI 对话限流
      max: 5
      window-seconds: 60
    answer:                              # 答题限流
      max: 30
      window-seconds: 60                 # ★ 修复：windows-seconds → window-seconds
    blacklist:                           # 黑名单规则
      violations: 3                      # ★ 修复：violation → violations
      window-seconds: 3600               # 违规计数窗口（1小时）
      ban-days: 1                        # 拉黑天数
  frontend-url: http://localhost:5173    # 前端地址（OAuth 回调跳转用）

# ===== Swagger（生产关闭，local 环境在 application-local.yml 开启）=====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false
