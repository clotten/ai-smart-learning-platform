# Docker 环境的后端配置（数据库连接被 docker-compose 环境变量覆盖）
server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ai_learning_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  mail:
    host: smtp.qq.com
    port: 587
    username: 由SPRING_MAIL_USERNAME注入    # compose 环境变量覆盖
    password: 由SPRING_MAIL_PASSWORD注入
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: 从.env的JWT_SECRET注入          # 占位符！真实值由 compose 环境变量覆盖
    expire-minutes: 1440
  deepseek:
    api-key: 从.env的DEEPSEEK_API_KEY注入    # 占位符！真实值由 compose 环境变量覆盖
    base-url: https://api.deepseek.com
    model: deepseek-chat
  rate-limit:
    ai: { max: 5, window-seconds: 60 }
    answer: { max: 30, window-seconds: 60 }
  smtp:
    from: 由APP_SMTP_FROM注入               # compose 环境变量覆盖
  oauth:
    github:
      client-id: 由APP_OAUTH_GITHUB_CLIENT_ID注入
      client-secret: 由APP_OAUTH_GITHUB_CLIENT_SECRET注入
      redirect-uri: http://192.168.146.102/api/auth/github/callback
  frontend-url: http://192.168.146.102    # 生产环境

springdoc:
  swagger-ui: { enabled: false }
  api-docs: { enabled: false }
