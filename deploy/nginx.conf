# 前端 Nginx 配置（容器内）
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;      # history 路由（部署时踩过的坑）
    }

    location /api/ {
        # ★ 服务名 backend = docker-compose 里的后端服务名（Docker 内部网络）
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;             # SSE 流式必需
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
