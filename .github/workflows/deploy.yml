# ============================================
# CI/CD 工作流：git push → 自动构建 + 部署
# 执行者：自托管 Runner（VM 上的 GitHub Actions Runner）
# 密钥来源：GitHub Secrets（加密存储，运行时生成 .env）
# ============================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:          # 手动触发按钮（Actions 页 → Run workflow）

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 生成 .env（密钥来自 GitHub Secrets，不落代码）
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env

      - name: 构建并部署（多阶段 Dockerfile 自动构建）
        run: |
          docker compose up -d --build
          docker compose ps

      - name: 健康检查
        run: |
          sleep 15
          curl -s -o /dev/null -w "前端 HTTP %{http_code}\n" http://localhost/ || echo "前端未就绪"
          docker ps --format "table {{.Names}}\t{{.Status}}"
